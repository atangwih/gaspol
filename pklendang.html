    <script>
        // ALERT TOAST HELPER
        function showNotification(msg, type = "success") {
            const colors = {
                success: "bg-emerald-600 text-white",
                error: "bg-red-600 text-white",
                warning: "bg-amber-500 text-white",
                info: "bg-blue-600 text-white"
            };
            const toast = document.createElement("div");
            toast.className = `fixed bottom-5 right-5 z-[100] px-4 py-3 rounded-xl shadow-xl font-medium text-sm flex items-center gap-3 transform transition-all duration-300 translate-y-10 opacity-0 ${colors[type]}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-lg"></i> <span>${msg}</span>`;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.classList.remove("translate-y-10", "opacity-0");
            }, 50);

            setTimeout(() => {
                toast.classList.add("translate-y-10", "opacity-0");
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // ═══════════════════════════════════════════════════════════════════════
        // GENERIC TABLE SORT & FILTER HELPER (dipakai di semua menu bertabel)
        // ═══════════════════════════════════════════════════════════════════════
        const tableState = {};

        function getTableState(name, defaults = {}) {
            if (!tableState[name]) {
                tableState[name] = { search: "", sortKey: null, sortDir: "asc", filters: {}, ...defaults };
            }
            return tableState[name];
        }

        function applyTableSort(data, state) {
            if (!state.sortKey) return data;
            const dir = state.sortDir === "asc" ? 1 : -1;
            return [...data].sort((a, b) => {
                let va = a[state.sortKey], vb = b[state.sortKey];
                const na = parseFloat(va), nb = parseFloat(vb);
                if (!isNaN(na) && !isNaN(nb) && va !== "" && vb !== "" && va !== undefined && vb !== undefined) {
                    va = na; vb = nb;
                } else {
                    va = (va ?? "").toString().toLowerCase();
                    vb = (vb ?? "").toString().toLowerCase();
                }
                if (va < vb) return -1 * dir;
                if (va > vb) return 1 * dir;
                return 0;
            });
        }

        function applyTableSearch(data, state, fields) {
            if (!state.search) return data;
            const q = state.search.toLowerCase();
            return data.filter(row => fields.some(f => (row[f] ?? "").toString().toLowerCase().includes(q)));
        }

        function toggleSort(name, key, rerenderFn) {
            const state = getTableState(name);
            if (state.sortKey === key) {
                state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
            } else {
                state.sortKey = key;
                state.sortDir = "asc";
            }
            rerenderFn();
        }

        function sortIcon(name, key) {
            const state = getTableState(name);
            if (state.sortKey !== key) return '<i class="fa-solid fa-sort text-slate-300 ml-1"></i>';
            return state.sortDir === "asc"
                ? '<i class="fa-solid fa-sort-up text-brand-600 ml-1"></i>'
                : '<i class="fa-solid fa-sort-down text-brand-600 ml-1"></i>';
        }

        // th yang bisa diklik untuk sort — dipakai berulang di semua tabel
        function sortableTh(name, key, label, rerenderFnName, extraClass = "") {
            return `<th class="p-3 border-b cursor-pointer select-none hover:bg-slate-100 transition ${extraClass}" onclick="toggleSort('${name}','${key}', ${rerenderFnName})">
                        <span class="inline-flex items-center">${label} ${sortIcon(name, key)}</span>
                    </th>`;
        }

        // Update state.search dari input lalu render ulang HANYA isi tabel (tbody),
        // supaya fokus & posisi kursor pada kotak pencarian tidak hilang saat mengetik.
        function onTableSearchInput(name, value, tbodyId, getRowsHtmlFn) {
            getTableState(name).search = value;
            const tbody = document.getElementById(tbodyId);
            if (tbody) tbody.innerHTML = getRowsHtmlFn();
        }

        function onTableFilterChange(name, filterKey, value, rerenderFn) {
            getTableState(name).filters[filterKey] = value;
            rerenderFn();
        }

        // ═══════════════════════════════════════════════════════════════════════
        // STATUS & SISA WAKTU PKL (Master Data Siswa)
        // ═══════════════════════════════════════════════════════════════════════

        // Ambil penempatan PKL terbaru milik seorang siswa (berdasarkan tanggal mulai terbaru)
        function getLatestPenempatan(nisn) {
            const list = appState.penempatan.filter(p => p.nisn === nisn);
            if (!list.length) return null;
            return list.slice().sort((a, b) => new Date(b.tgl_mulai) - new Date(a.tgl_mulai))[0];
        }

        // Hitung status PKL siswa secara dinamis: Belum Terdaftar / Terdaftar PKL / Sedang PKL / Selesai PKL / Gagal PKL - Mengulang
        function computeStatusPKL(nisn) {
            const p = getLatestPenempatan(nisn);
            if (!p) return { label: "Belum Terdaftar", badge: "bg-slate-100 text-slate-600" };
            if (p.status === "Gagal") return { label: "Gagal PKL - Mengulang", badge: "bg-red-100 text-red-700" };

            const today = new Date(); today.setHours(0, 0, 0, 0);
            const mulai = new Date(p.tgl_mulai);
            const selesai = new Date(p.tgl_selesai);

            if (today < mulai) return { label: "Terdaftar PKL", badge: "bg-blue-100 text-blue-700" };
            if (today <= selesai) return { label: "Sedang PKL", badge: "bg-emerald-100 text-emerald-700" };
            return { label: "Selesai PKL", badge: "bg-indigo-100 text-indigo-700" };
        }

        // Hitung teks & warna "Sisa Waktu PKL" untuk ditampilkan di Master Data Siswa
        function getSisaWaktuPKL(nisn) {
            const p = getLatestPenempatan(nisn);
            if (!p) return { text: "-", cls: "text-slate-400" };
            if (p.status === "Gagal") return { text: "-", cls: "text-slate-400" };

            const today = new Date(); today.setHours(0, 0, 0, 0);
            const mulai = new Date(p.tgl_mulai);
            const selesai = new Date(p.tgl_selesai);

            if (today < mulai) {
                const days = Math.ceil((mulai - today) / 86400000);
                return { text: `Mulai ${days} hari lagi`, cls: "text-blue-600" };
            }
            if (today > selesai) {
                return { text: "Selesai", cls: "text-slate-400" };
            }
            const daysLeft = Math.ceil((selesai - today) / 86400000);
            let cls = "text-emerald-600 font-bold";
            if (daysLeft <= 7) cls = "text-red-600 font-bold";
            else if (daysLeft <= 14) cls = "text-amber-600 font-bold";
            return { text: `${daysLeft} hari lagi`, cls };
        }

        // Admin/Guru menandai siswa Gagal PKL (harus mengulang penempatan baru)
        async function markGagalPKL(nisn) {
            const p = getLatestPenempatan(nisn);
            if (!p) return;
            if (!confirm(`Tandai siswa ini sebagai GAGAL PKL di "${p.nama_perusahaan}"? Siswa harus ditempatkan ulang (mengulang) setelah ini.`)) return;

            try {
                await apiCall("updatePenempatanStatus", { id_penempatan: p.id_penempatan, status: "Gagal" });
                invalidateApiCache();
                p.status = "Gagal";
                showNotification("Status siswa ditandai Gagal PKL. Silakan lakukan penempatan ulang.", "warning");
                if (currentActiveMenu) switchMenu(currentActiveMenu);
            } catch (err) {
                showNotification(`Gagal memperbarui status: ${err.message}`, "error");
            }
        }

        // FETCH API COMMUNICATOR TO GAS
        // Catatan koneksi:
        // - Content-Type "text/plain" sengaja dipakai agar browser TIDAK mengirim preflight
        //   OPTIONS request (Google Apps Script Web App tidak bisa merespons preflight CORS).
        // - Menggunakan AbortController agar request yang menggantung (server GAS lambat / cold start)
        //   tidak membuat UI stuck selamanya — user dapat feedback yang jelas.
        // - Cache sederhana in-memory (apiCache) untuk aksi "getAllData" agar tidak berulang kali
        //   membaca Spreadsheet saat user berpindah-pindah menu dalam waktu singkat.
        const API_TIMEOUT_MS = 25000;
        let apiCacheData = null;
        let apiCacheTime = 0;
        const API_CACHE_TTL_MS = 15000;

        async function apiCall(action, payload = {}, options = {}) {
            if (IS_PREVIEW) {
                console.log(`[PREVIEW API CALL] Action: ${action}`, payload);
                await new Promise(r => setTimeout(r, 350)); // Simulasi latensi
                return { status: "success", message: "Operasi sukses (Mode Preview)", data: appState };
            }

            // Gunakan cache singkat khusus untuk getAllData supaya perpindahan menu terasa instan
            if (action === "getAllData" && !options.force) {
                const isFresh = apiCacheData && (Date.now() - apiCacheTime < API_CACHE_TTL_MS);
                if (isFresh) return apiCacheData;
            }

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), API_TIMEOUT_MS);

            try {
                const response = await fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action, ...payload }),
                    signal: controller.signal
                });

                if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                const res = await response.json();
                if (res.status !== "success" && res.status !== "ok") {
                    throw new Error(res.message || "Gagal memproses permintaan");
                }

                if (action === "getAllData") {
                    apiCacheData = res;
                    apiCacheTime = Date.now();
                }
                return res;
            } catch (err) {
                if (err.name === "AbortError") {
                    throw new Error("Koneksi ke server terlalu lama (timeout). Periksa jaringan Anda dan coba lagi.");
                }
                console.error("API Error:", err);
                throw new Error(err.message || "Tidak dapat terhubung ke server. Periksa URL GAS & koneksi internet.");
            } finally {
                clearTimeout(timeoutId);
            }
        }

        // ═══════════════════════════════════════════════════════════════════════
        // NORMALISASI DATA DARI SPREADSHEET
        // Google Sheets otomatis mengubah "005123456" menjadi ANGKA 5123456. Akibatnya
        // perbandingan seperti x.nisn === "5123456" (string vs number) selalu FALSE,
        // sehingga muncul "Data siswa tidak ditemukan di database" dan pencarian error.
        // Solusi: paksa semua kolom ID/kunci menjadi string yang bersih (trim).
        // ═══════════════════════════════════════════════════════════════════════
        const ID_FIELDS = [
            "nisn", "nip", "id_ref", "username", "id_kelas", "id_tempat", "id_penempatan",
            "id_absen", "id_monitoring", "id_jurnal", "id_nilai", "nip_pembimbing", "telepon", "kontak"
        ];

        function normalizeRows(rows) {
            return (Array.isArray(rows) ? rows : []).map(row => {
                const o = { ...row };
                ID_FIELDS.forEach(f => {
                    if (o[f] !== undefined && o[f] !== null) o[f] = String(o[f]).trim();
                });
                return o;
            });
        }

        function escHtml(v) {
            return String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
        }

        // ═══════════════════════════════════════════════════════════════════════
        // HELPER LOADING ANIMASI + ERROR HANDLING UNTUK SEMUA FORM SUBMIT
        // Ini memastikan: (1) tombol memberi feedback visual "sedang diproses",
        // (2) bila apiCall gagal, errornya TERTANGKAP dan ditampilkan sebagai notifikasi
        //     alih-alih diam-diam gagal (yang sebelumnya membuat data tampak "tidak muncul"
        //     kecuali di-refresh manual, padahal errornya tidak pernah diberitahukan ke user).
        // ═══════════════════════════════════════════════════════════════════════
        async function withSubmitLoading(e, loadingLabel, fn) {
            const form = e.target.closest ? e.target.closest("form") : e.target;
            const btn = form ? form.querySelector('button[type="submit"]') : null;
            const originalHtml = btn ? btn.innerHTML : null;

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> ${loadingLabel}`;
            }

            try {
                await fn();
            } catch (err) {
                console.error(err);
                showNotification(`Gagal menyimpan: ${err.message}`, "error");
            } finally {
                // Hanya restore tombol jika modal masih terbuka (elemen belum dihapus dari DOM,
                // artinya proses gagal/dibatalkan — kalau sukses, modal sudah ditutup duluan).
                if (btn && document.body.contains(btn)) {
                    btn.disabled = false;
                    btn.innerHTML = originalHtml;
                }
            }
        }

        // MEMUAT SEMUA DATA DARI SPREADSHEET (Bug lama: backend punya "getAllData"
        // tapi tidak pernah dipanggil frontend, sehingga data yang tampil selalu data contoh/dummy)
        let isDataLoading = false;
        async function loadAllData(options = {}) {
            if (IS_PREVIEW) return true; // Mode preview tetap pakai data simulasi lokal

            isDataLoading = true;
            toggleDataLoadingUI(true);
            try {
                const res = await apiCall("getAllData", {}, options);
                const d = res.data || {};
                appState.kelas      = normalizeRows(d.kelas);
                appState.tempatPKL  = normalizeRows(d.tempatPKL);
                appState.siswa      = normalizeRows(d.siswa);
                appState.guru       = normalizeRows(d.guru);
                appState.penempatan = normalizeRows(d.penempatan);
                appState.absensi    = normalizeRows(d.absensi);
                appState.monitoring = normalizeRows(d.monitoring);
                appState.jurnal     = normalizeRows(d.jurnal);
                appState.nilai      = normalizeRows(d.nilai);
                return true;
            } catch (err) {
                showNotification(`Gagal memuat data: ${err.message}`, "error");
                return false;
            } finally {
                isDataLoading = false;
                toggleDataLoadingUI(false);
            }
        }

        // HAVERSINE GEOFENCING FORMULA (Meter)
        function calculateDistance(lat1, lon1, lat2, lon2) {
            const R = 6371e3; // Earth radius in meters
            const φ1 = lat1 * Math.PI / 180;
            const φ2 = lat2 * Math.PI / 180;
            const Δφ = (lat2 - lat1) * Math.PI / 180;
            const Δλ = (lon2 - lon1) * Math.PI / 180;

            const a = Math.sin(Δφ / 2) * Math.sin(Δφ / 2) +
                      Math.cos(φ1) * Math.cos(φ2) *
                      Math.sin(Δλ / 2) * Math.sin(Δλ / 2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
            return Math.round(R * c);
        }

            return o;
        }

        // ═══ PETA PEMILIH LOKASI (Leaflet + OpenStreetMap) ═══
        const HARI_OPTIONS = ["Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu", "Minggu"];
        let idukaMap = null;
        let idukaMarker = null;
        let idukaRadiusCircle = null;

        function initIdukaMap() {
            const mapEl = document.getElementById("idukaMapContainer");
            if (!mapEl || typeof L === "undefined") return;

            const lat = parseFloat(document.getElementById("formLatIduka").value) || -6.4025;
            const lng = parseFloat(document.getElementById("formLngIduka").value) || 107.4521;
            const radius = parseInt(document.getElementById("formRadius").value) || 100;

            idukaMap = L.map("idukaMapContainer").setView([lat, lng], 16);

            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
                maxZoom: 19
            }).addTo(idukaMap);

            idukaMarker = L.marker([lat, lng], { draggable: true }).addTo(idukaMap);
            idukaRadiusCircle = L.circle([lat, lng], {
                radius: radius,
                color: "#16a34a",
                fillColor: "#16a34a",
                fillOpacity: 0.15,
                weight: 2
            }).addTo(idukaMap);

            // Klik di peta memindahkan marker
            idukaMap.on("click", (e) => setIdukaMapPosition(e.latlng.lat, e.latlng.lng, false));

            // Drag marker memindahkan titik
            idukaMarker.on("dragend", () => {
                const pos = idukaMarker.getLatLng();
                setIdukaMapPosition(pos.lat, pos.lng, false);
            });

            // Perbaiki bug umum Leaflet: peta abu-abu/terpotong jika di-render di dalam modal yang baru muncul
            setTimeout(() => idukaMap.invalidateSize(), 200);
        }

        // Dipanggil saat marker digeser / peta diklik — perbarui input lat/lng
        function setIdukaMapPosition(lat, lng, recenter = true) {
            document.getElementById("formLatIduka").value = lat.toFixed(6);
            document.getElementById("formLngIduka").value = lng.toFixed(6);
            if (idukaMarker) idukaMarker.setLatLng([lat, lng]);
            if (idukaRadiusCircle) idukaRadiusCircle.setLatLng([lat, lng]);
            if (idukaMap && recenter) idukaMap.setView([lat, lng]);
        }

        // Dipanggil saat user mengetik manual di kolom Latitude/Longitude
        function onIdukaCoordInputChange() {
            const lat = parseFloat(document.getElementById("formLatIduka").value);
            const lng = parseFloat(document.getElementById("formLngIduka").value);
            if (isNaN(lat) || isNaN(lng)) return;
            if (idukaMarker) idukaMarker.setLatLng([lat, lng]);
            if (idukaRadiusCircle) idukaRadiusCircle.setLatLng([lat, lng]);
            if (idukaMap) idukaMap.setView([lat, lng]);
        }

        // Efek radius: lingkaran di peta membesar/mengecil live sesuai input meter
        function onIdukaRadiusChange() {
            const radius = parseInt(document.getElementById("formRadius").value);
            if (idukaRadiusCircle && !isNaN(radius) && radius > 0) {
                idukaRadiusCircle.setRadius(radius);
                if (idukaMap) idukaMap.fitBounds(idukaRadiusCircle.getBounds(), { maxZoom: 18 });
            }
        }

        // Cari lokasi berdasarkan nama alamat/tempat memakai Nominatim (geocoding gratis OpenStreetMap)
        async function searchMapLocation() {
            const query = document.getElementById("formMapSearch").value.trim();
            if (!query) return;
            try {
                const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`);
                const results = await res.json();
                if (!results.length) {
                    showNotification("Lokasi tidak ditemukan, coba kata kunci lain.", "warning");
                    return;
                }
                setIdukaMapPosition(parseFloat(results[0].lat), parseFloat(results[0].lon), true);
                if (idukaMap) idukaMap.setView([results[0].lat, results[0].lon], 17);
                showNotification("Lokasi ditemukan & ditandai di peta.");
            } catch (err) {
                showNotification("Gagal mencari lokasi (periksa koneksi internet).", "error");
            }
        }

        function getCurrentGPSLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    setIdukaMapPosition(pos.coords.latitude, pos.coords.longitude, true);
                    if (idukaMap) idukaMap.setView([pos.coords.latitude, pos.coords.longitude], 17);
                    showNotification("Koordinat GPS berhasil terisi!");
                }, err => {
                    showNotification("Gagal mengambil GPS: " + err.message, "error");
                });
            } else {
                showNotification("Browser tidak mendukung GPS.", "error");
            }
        }

        async function saveIduka(e, editId = null) {
            e.preventDefault();
            const hariAktif = Array.from(document.querySelectorAll('input[name="hariAktif"]:checked')).map(el => el.value);
            if (hariAktif.length === 0) {
                showNotification("Pilih minimal satu hari aktif PKL.", "warning");
                return;
            }

            const idukaData = {
                id_tempat: document.getElementById("formIdIduka").value,
                nama_perusahaan: document.getElementById("formNamaPerusahaan").value,
                alamat: document.getElementById("formAlamatIduka").value,
                kontak: document.getElementById("formKontakIduka").value,
                lat: parseFloat(document.getElementById("formLatIduka").value),
                lng: parseFloat(document.getElementById("formLngIduka").value),
                radius_meter: parseInt(document.getElementById("formRadius").value),
                kuota: parseInt(document.getElementById("formKuota").value),
                hari_aktif: hariAktif.join(",")
            };

            if (editId) {
                await withSubmitLoading(e, "Menyimpan Perubahan...", async () => {
                    await apiCall("updateIDUKA", idukaData);
                    invalidateApiCache();
                    const idx = appState.tempatPKL.findIndex(i => i.id_tempat === editId);
                    if (idx !== -1) appState.tempatPKL[idx] = idukaData;
                    closeModal();
                    destroyIdukaMap();
                    showNotification("Data IDUKA berhasil diperbarui!");
                    renderIdukaMenu();
                });
                return;
            }

            await withSubmitLoading(e, "Menyimpan...", async () => {
                await apiCall("saveIDUKA", idukaData);
                invalidateApiCache();
                appState.tempatPKL.push(idukaData);
                closeModal();
                destroyIdukaMap();
                showNotification("IDUKA berhasil ditambahkan!");
                renderIdukaMenu();
            });
        }

        function destroyIdukaMap() {
            if (idukaMap) {
                idukaMap.remove();
                idukaMap = null;
                idukaMarker = null;
                idukaRadiusCircle = null;
            }
        }

        async function deleteIduka(id) {
            if (!confirm(`Yakin ingin menghapus data IDUKA "${id}"? Tindakan ini tidak dapat dibatalkan.`)) return;
            try {
                await apiCall("deleteIDUKA", { id_tempat: id });
                invalidateApiCache();
                appState.tempatPKL = appState.tempatPKL.filter(i => i.id_tempat !== id);

        function getSiswaFilteredSorted() {
            const state = getTableState("siswa");
            let data = appState.siswa.map(s => ({
                ...s,
                _status: computeStatusPKL(s.nisn).label,
                _sisaSort: (() => {
                    const p = getLatestPenempatan(s.nisn);
                    return p ? new Date(p.tgl_selesai).getTime() : 0;
                })()
            }));
            data = applyTableSearch(data, state, ["nisn", "nama_siswa", "id_kelas", "telepon"]);
            if (state.filters.kelas) data = data.filter(s => s.id_kelas === state.filters.kelas);
            if (state.filters.status) data = data.filter(s => s._status === state.filters.status);
            // Kolom "sisa waktu" disortir berdasarkan tanggal selesai penempatan aktif
            if (state.sortKey === "sisa_waktu") {
                const dir = state.sortDir === "asc" ? 1 : -1;
                return [...data].sort((a, b) => (a._sisaSort - b._sisaSort) * dir);
            }
            return applyTableSort(data, state);
        }

        // Helper: nama kelas dari ID kelas (dipakai di Master Data Siswa)
        function getNamaKelas(idKelas) {
            const k = appState.kelas.find(k => k.id_kelas === idKelas);
            return k ? k.nama_kelas : idKelas;
        }

        // Helper: ubah nomor telepon lokal (08xx / +62xx) menjadi link wa.me yang valid
        function waLink(phone) {
            if (!phone) return null;
            let digits = phone.toString().replace(/[^0-9]/g, "");
            if (digits.startsWith("0")) digits = "62" + digits.slice(1);
            else if (!digits.startsWith("62")) digits = "62" + digits;
            return `https://wa.me/${digits}`;
        }

                        <button type="button" onclick="togglePasswordVisibility('${prefix}Password')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-eye" id="${prefix}PasswordEyeIcon"></i>
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Konfirmasi Password</label>
                    <div class="relative">
                        <input type="password" id="${prefix}PasswordConfirm" required minlength="6" placeholder="Ulangi password yang sama" class="w-full p-3 pr-10 rounded-xl border border-slate-200 text-sm">
                        <button type="button" onclick="togglePasswordVisibility('${prefix}PasswordConfirm')" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                            <i class="fa-solid fa-eye" id="${prefix}PasswordConfirmEyeIcon"></i>
                        </button>
                    </div>
                </div>
                <button type="button" onclick="generateRandomPassword('${prefix}Password','${prefix}PasswordConfirm')" class="text-xs font-medium text-brand-600 hover:text-brand-700 flex items-center gap-1.5 -mt-1">
                    <i class="fa-solid fa-shuffle"></i> Buatkan Password Acak Otomatis
                </button>
                <p class="text-[11px] text-slate-400 -mt-1">Password ini yang akan dipakai untuk login ke aplikasi. Catat & sampaikan ke yang bersangkutan.</p>
            `;
        }

        function togglePasswordVisibility(inputId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(inputId + "EyeIcon");
            if (!input) return;
            const showing = input.type === "text";
            input.type = showing ? "password" : "text";
            if (icon) {
                icon.classList.toggle("fa-eye", showing);
                icon.classList.toggle("fa-eye-slash", !showing);
            }
        }

        function generateRandomPassword(inputId, confirmId) {
            const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789";
            let pass = "";
            for (let i = 0; i < 8; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));

            const input = document.getElementById(inputId);
            const confirmInput = document.getElementById(confirmId);
            if (input) { input.type = "text"; input.value = pass; }
            if (confirmInput) { confirmInput.type = "text"; confirmInput.value = pass; }

            const icon1 = document.getElementById(inputId + "EyeIcon");
            const icon2 = document.getElementById(confirmId + "EyeIcon");
            [icon1, icon2].forEach(ic => { if (ic) { ic.classList.remove("fa-eye"); ic.classList.add("fa-eye-slash"); } });

            showNotification(`Password acak dibuat: "${pass}" — pastikan dicatat sebelum menyimpan.`, "info");
        }

        // Validasi kecocokan password sebelum submit form. Mengembalikan password bila valid, atau null (+ notifikasi) bila tidak.
        function validatePasswordFields(prefix) {
            const pass = document.getElementById(prefix + "Password").value;
            const confirm = document.getElementById(prefix + "PasswordConfirm").value;
            if (pass.length < 6) {
                showNotification("Password minimal 6 karakter.", "warning");
                return null;
            }
            if (pass !== confirm) {
                showNotification("Password dan Konfirmasi Password tidak sama.", "warning");
                return null;
            }
            return pass;
        }

        async function saveSiswa(e, editId = null) {
            e.preventDefault();

            if (editId) {
                // Mode edit: password opsional — hanya divalidasi jika toggle "Reset Password" dicentang
                const resetChecked = document.getElementById("formSiswaResetToggle")?.checked;
                let password = null;
                if (resetChecked) {
                    password = validatePasswordFields('formSiswa');
                    if (!password) return;
                }

                const updatedS = {
                    nisn: editId,
                    nama_siswa: document.getElementById("formNamaSiswa").value,
                    id_kelas: document.getElementById("formSiswaKelas").value,
                    telepon: document.getElementById("formTeleponSiswa").value
                };

                await withSubmitLoading(e, "Menyimpan Perubahan...", async () => {
                    await apiCall("updateSiswa", { ...updatedS, password: password || undefined });
                    invalidateApiCache();
                    const idx = appState.siswa.findIndex(s => s.nisn === editId);
                    if (idx !== -1) appState.siswa[idx] = { ...appState.siswa[idx], ...updatedS };
                    closeModal();
                    showNotification("Data siswa berhasil diperbarui!" + (password ? " Password login juga telah direset." : ""));
                    renderSiswaMenu();
                });
                return;
            }

            const password = validatePasswordFields('formSiswa');
            if (!password) return;

            const newS = {
                nisn: document.getElementById("formNisn").value,
                nama_siswa: document.getElementById("formNamaSiswa").value,
                id_kelas: document.getElementById("formSiswaKelas").value,
                telepon: document.getElementById("formTeleponSiswa").value,
                status_pkl: "Belum PKL"
            };

            await withSubmitLoading(e, "Menyimpan & Membuat Akun...", async () => {
                await apiCall("saveSiswa", { ...newS, password });
                invalidateApiCache();
                appState.siswa.push(newS);
                closeModal();
                showNotification(`Data siswa berhasil disimpan! Akun login: ${newS.nisn} / (password sesuai yang diinput)`);
                renderSiswaMenu();
            });
        }

        // Bangun <option> daftar siswa (dengan filter nama / NISN / kelas).
        // Dibuat ulang setiap kali mengetik (bukan sekadar menyembunyikan <option>),
        // karena atribut "hidden" pada <option> tidak didukung di Safari/iOS & sebagian browser HP.
        function buildSiswaOptions(query) {
            const q = String(query || "").toLowerCase().trim();
            const list = appState.siswa.filter(s => {
                if (!q) return true;
                const namaKelas = getNamaKelas(s.id_kelas);
                return [s.nama_siswa, s.nisn, s.id_kelas, namaKelas]
                    .some(v => String(v ?? "").toLowerCase().includes(q));
            });

            let html = `<option value="" disabled selected>-- Pilih Siswa --</option>`;
            if (!appState.siswa.length) {
                html = `<option value="" disabled selected>Data siswa kosong / belum termuat. Tutup form lalu klik Segarkan Data.</option>`;
            } else if (!list.length) {
                html += `<option value="" disabled>Tidak ada siswa yang cocok</option>`;
            } else {
                html += list.map(s =>
                    `<option value="${escHtml(s.nisn)}">${escHtml(s.nama_siswa)} (${escHtml(s.nisn)} - ${escHtml(getNamaKelas(s.id_kelas))})</option>`
                ).join("");
            }
            return { html, count: list.length };
        }

        // Filter daftar siswa pada listbox Form Penempatan berdasarkan nama/NISN/kelas yang diketik
        function filterSiswaOptions() {
            const input = document.getElementById("formPlotSiswaSearch");
            const select = document.getElementById("formPlotSiswa");
            if (!input || !select) return;

            const query = input.value.trim();
            const previous = select.value;
            const { html, count } = buildSiswaOptions(query);
            select.innerHTML = html;

            // Pertahankan pilihan sebelumnya bila masih tampil; kalau hasil pencarian tepat 1, pilih otomatis
            const stillThere = previous && Array.from(select.options).some(o => o.value === previous);
            if (stillThere) {
                select.value = previous;
            } else if (query && count === 1) {
                select.selectedIndex = 1;
            }
            validateSiswaSelection();

            const countLabel = document.getElementById("formPlotSiswaCount");
            if (countLabel) {
                countLabel.textContent = query
                    ? `${count} dari ${appState.siswa.length} siswa cocok dengan "${query}"`
                    : `${appState.siswa.length} total siswa terdaftar`;
            }
        }

        function calcDurasi() {
            const m = new Date(document.getElementById("formTglMulai").value);
            const s = new Date(document.getElementById("formTglSelesai").value);
            if (m && s && s >= m) {
                const diffTime = Math.abs(s - m);
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
                document.getElementById("durasiPreview").textContent = `${diffDays} Hari`;
            }
        }

        function validateSiswaSelection() {
            const nisn = document.getElementById("formPlotSiswa").value;
            const errorMsg = document.getElementById("formPlotSiswaError");
            if (nisn && nisn.trim() !== "") {
                if (errorMsg) errorMsg.classList.add("hidden");
            }
        }

        function resetFormValidation() {
            const errorMsg = document.getElementById("formPlotSiswaError");
            if (errorMsg) errorMsg.classList.add("hidden");
        }

        async function savePenempatan(e) {
            e.preventDefault();
            const nisn = document.getElementById("formPlotSiswa") ? document.getElementById("formPlotSiswa").value : "";
            const id_tempat = document.getElementById("formPlotIduka") ? document.getElementById("formPlotIduka").value : "";
            const nip_pembimbing = document.getElementById("formPlotGuru") ? document.getElementById("formPlotGuru").value : "";
            const tgl_mulai = document.getElementById("formTglMulai") ? document.getElementById("formTglMulai").value : "";
            const tgl_selesai = document.getElementById("formTglSelesai") ? document.getElementById("formTglSelesai").value : "";

            // VALIDASI: Pastikan semua field terisi
            if (!nisn || nisn.trim() === "") {
                const errorMsg = document.getElementById("formPlotSiswaError");
                if (errorMsg) errorMsg.classList.remove("hidden");
                showNotification("Siswa harus dipilih dari daftar yang tersedia!", "warning");
                return;
            }

            if (!id_tempat || id_tempat.trim() === "") {
                showNotification("Tempat PKL (IDUKA) harus dipilih!", "warning");
                return;
            }

            if (!nip_pembimbing || nip_pembimbing.trim() === "") {
                showNotification("Guru Pembimbing harus dipilih!", "warning");
                return;
            }

            if (!tgl_mulai || !tgl_selesai) {
                showNotification("Tanggal mulai dan selesai PKL harus diisi!", "warning");
                return;
            }

            const m = new Date(tgl_mulai);
            const s = new Date(tgl_selesai);

            if (s < m) {
                showNotification("Tanggal selesai tidak boleh lebih awal dari tanggal mulai!", "warning");
                return;
            }

            const durasi_hari = Math.round(Math.abs(s - m) / (1000 * 60 * 60 * 24)) + 1;

            const same = (a, b) => String(a ?? "").trim() === String(b ?? "").trim();
            const findAll = () => ({
                siswaObj: appState.siswa.find(x => same(x.nisn, nisn)),
                idukaObj: appState.tempatPKL.find(x => same(x.id_tempat, id_tempat)),
                guruObj: appState.guru.find(x => same(x.nip, nip_pembimbing))
            });

            let { siswaObj, idukaObj, guruObj } = findAll();

            // Bila ada yang belum ketemu, muat ulang data dari server sekali lalu coba lagi
            if (!siswaObj || !idukaObj || !guruObj) {
                invalidateApiCache();
                await loadAllData({ force: true });
                ({ siswaObj, idukaObj, guruObj } = findAll());
            }

            if (!siswaObj) {
                showNotification("Data siswa tidak ditemukan di database. Refresh halaman dan coba lagi.", "error");
                return;
            }

            if (!idukaObj) {
                showNotification("Data IDUKA tidak ditemukan di database. Refresh halaman dan coba lagi.", "error");
                return;
            }

            if (!guruObj) {
                showNotification("Data guru tidak ditemukan di database. Refresh halaman dan coba lagi.", "error");
                return;
            }

            // ID unik: ambil nomor terbesar yang ada + 1 (aman walau ada data yang pernah dihapus)
            const maxNo = appState.penempatan.reduce((mx, p) => {
                const n = parseInt(String(p.id_penempatan).replace(/\D/g, ""), 10);
                return isNaN(n) ? mx : Math.max(mx, n);
            }, 0);
            const newPlot = {
                id_penempatan: `PNP-${String(maxNo + 1).padStart(2, "0")}`,
                nisn, nama_siswa: siswaObj.nama_siswa,
                id_tempat, nama_perusahaan: idukaObj.nama_perusahaan,
                nip_pembimbing, nama_guru: guruObj.nama_guru,
                tgl_mulai, tgl_selesai, durasi_hari, status: "Aktif"
            };

            await withSubmitLoading(e, "Menyimpan Penempatan...", async () => {
                await apiCall("assignPKL", newPlot);
                invalidateApiCache();
                appState.penempatan.push(newPlot);
                siswaObj.status_pkl = "Terdaftar PKL";

                closeModal();
                showNotification("✓ Siswa berhasil ditempatkan di IDUKA!");
                renderPenempatanMenu();
            });
        }

        /* ═══════════════════════════════════════════════════════════════════════
           MODULE: ABSENSI GPS GEOFENCING (SISWA)

        function renderAbsensiMenu() {

                `;

            }

            const idukaObj = appState.tempatPKL.find(i => i.id_tempat === pkl.id_tempat);

                main.innerHTML = `
                    <div class="max-w-xl mx-auto space-y-6">

                        </div>

                            <i class="fa-solid fa-circle-check text-4xl text-emerald-500"></i>

            main.innerHTML = `
                <div class="max-w-xl mx-auto space-y-6">
                    <div class="text-center border-b border-slate-100 pb-4">

                        <p class="text-xs text-slate-500">Sistem memverifikasi lokasi real-time Anda dengan radius perusahaan.</p>
                    </div>

                    <div class="bg-slate-50 p-4 rounded-2xl border border-slate-200/80 space-y-2">
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-500">Lokasi IDUKA Target:</span>
                            <span class="font-bold text-slate-800">${idukaObj.nama_perusahaan}</span>
                        </div>
                        <div class="flex justify-between text-xs">
                            <span class="text-slate-500">Maksimal Radius Diizinkan:</span>
                            <span class="font-bold text-brand-700">${idukaObj.radius_meter} Meter</span>
                        </div>
                    </div>

                    <!-- GPS CAMERA CARD -->
                    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm text-center space-y-4">
                        <div id="gpsStatusBox" class="p-4 bg-slate-100 rounded-xl text-slate-600 text-xs flex flex-col items-center gap-2">
                            <i class="fa-solid fa-location-crosshairs text-2xl text-slate-400"></i>
                            <span>Klik tombol di bawah untuk mendapatkan titik koordinat presensi Anda.</span>
                        </div>

                        <div class="flex gap-3">
                            <button onclick="checkStudentLocation(${idukaObj.lat}, ${idukaObj.lng}, ${idukaObj.radius_meter})" class="flex-1 py-3 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-medium text-xs shadow flex items-center justify-center gap-2">
                                <i class="fa-solid fa-compass"></i> Deteksi Lokasi GPS Saya
                            </button>
                        </div>

                        <div id="attendanceActionArea" class="hidden space-y-4 pt-4 border-t border-slate-100">
                            <button onclick="submitAbsenNow('${user.username}')" id="btnSubmitAbsen" class="w-full py-3.5 bg-brand-600 hover:bg-brand-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-brand-600/30 transition flex items-center justify-center gap-2">
                                <i class="fa-solid fa-camera"></i> Kirim Presensi Masuk Sekarang
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        let currentDetectedDistance = null;
        let currentDetectedCoords = null;

        function checkStudentLocation(targetLat, targetLng, maxRadius) {
            const box = document.getElementById("gpsStatusBox");
            box.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin text-2xl text-brand-600"></i><br>Mendapatkan lokasi GPS presisi...`;

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const lat = pos.coords.latitude;
                    const lng = pos.coords.longitude;
                    const dist = calculateDistance(lat, lng, targetLat, targetLng);

                    currentDetectedDistance = dist;
                    currentDetectedCoords = { lat, lng };

                    if (dist <= maxRadius) {
                        box.className = "p-4 bg-emerald-50 border border-emerald-200 text-emerald-800 rounded-xl text-xs space-y-1";
                        box.innerHTML = `
                            <i class="fa-solid fa-circle-check text-2xl text-emerald-600"></i>
                            <p class="font-bold text-sm">Lokasi Sesuai Radius!</p>
                            <p>Jarak Anda: <strong>${dist} Meter</strong> dari titik IDUKA (Radius Max: ${maxRadius}m).</p>
                        `;
                        document.getElementById("attendanceActionArea").classList.remove("hidden");
                    } else {
                        box.className = "p-4 bg-red-50 border border-red-200 text-red-800 rounded-xl text-xs space-y-1";
                        box.innerHTML = `
                            <i class="fa-solid fa-circle-xmark text-2xl text-red-600"></i>
                            <p class="font-bold text-sm">Di Luar Radius Perusahaan!</p>
                            <p>Jarak Anda: <strong>${dist} Meter</strong> dari lokasi. Anda berada di luar jangkauan yang diizinkan (${maxRadius}m).</p>
                        `;
                        document.getElementById("attendanceActionArea").classList.add("hidden");
                    }
                }, err => {
                    box.className = "p-4 bg-amber-50 text-amber-800 rounded-xl text-xs";
                    box.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-xl"></i> Gagal akses GPS: ${err.message}`;
                });
            } else {
                box.innerHTML = "Browser tidak mendukung geolocation GPS.";
            }
        }

        async function submitAbsenNow(nisn) {
            const today = new Date().toISOString().split('T')[0];
            // Cegah ceklok ganda: 1 siswa hanya boleh 1 catatan presensi per hari
            const existing = appState.absensi.find(a => a.nisn === nisn && a.tgl === today);
            if (existing) {
                showNotification(`Anda sudah tercatat presensi hari ini (${today}) dengan status "${existing.status_presensi}". Hubungi guru pembimbing/admin jika perlu koreksi.`, "warning");
                return;
            }

            const btn = document.getElementById("btnSubmitAbsen");
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Mengirim Presensi...`;

            const now = new Date();
            const newAbsen = {
                id_absen: `ABS-${Date.now().toString().slice(-4)}`,
                nisn,
                nama_siswa: appState.currentUser.nama,
                tgl: today,
                jam_masuk: now.toTimeString().slice(0, 5),
                jam_pulang: "-",
                lat: currentDetectedCoords.lat,
                lng: currentDetectedCoords.lng,
                jarak_meter: currentDetectedDistance,
                status_presensi: "Hadir (Sesuai Radius)"
            };

            try {
                await apiCall("submitAbsensi", newAbsen);
                invalidateApiCache();
                appState.absensi.push(newAbsen);
                showNotification("Presensi berhasil dikirim!", "success");
                renderAbsensiMenu();
            } catch (err) {
                showNotification("Gagal presensi: " + err.message, "error");
            } finally {btn.disabled = false;
            }
        }

        /* ═══════════════════════════════════════════════════════════════════════
           MODULE: REKAPITULASI ABSENSI PKL (HARIAN & BULANAN + ALERT KETIDAKHADIRAN)
           ═════════════════════════════════════════════════════════════════════ */

        let currentAbsensiView = "harian"; // 'harian' atau 'bulanan'

        function getAbsensiFilteredSorted() {
            const state = getTableState("rekapAbsensi", { sortKey: "tgl", sortDir: "desc" });
            let data = appState.absensi;
            if (state.filters.tglAwal) data = data.filter(a => a.tgl >= state.filters.tglAwal);
            if (state.filters.tglAkhir) data = data.filter(a => a.tgl <= state.filters.tglAkhir);
            if (state.filters.status) data = data.filter(a => a.status_presensi === state.filters.status);
            data = applyTableSearch(data, state, ["nama_siswa", "nisn"]);
            return applyTableSort(data, state);
        }

        function getRekapAbsensiRowsHtml() {
            const data = getAbsensiFilteredSorted();
            const user = appState.currentUser;
            if (!data.length) return `<tr><td colspan="7" class="p-6 text-center text-slate-400 text-sm">Tidak ada catatan presensi pada rentang/filter ini.</td></tr>`;
            return data.map(a => {
                let badgeClass = "bg-emerald-100 text-emerald-800 border-emerald-300";
                let icon = "fa-circle-check";

                if (a.status_presensi.includes("Alpha") || a.status_presensi.includes("Tidak Hadir")) {
                    badgeClass = "bg-red-100 text-red-800 border-red-300 font-bold";
                    icon = "fa-circle-xmark";
                } else if (a.status_presensi === "Sakit" || a.status_presensi === "Izin") {
                    badgeClass = "bg-amber-100 text-amber-800 border-amber-300";
                    icon = "fa-circle-exclamation";

                return `
                    <tr class="${a.status_presensi.includes('Alpha') ? 'bg-red-50/50' : 'hover:bg-slate-50'} transition">
                        <td class="p-3 font-semibold text-slate-800 whitespace-nowrap">${a.tgl}</td>

        function showFormManualAbsensi(editId = null) {
            const editing = !!editId;
            const rec = editing ? appState.absensi.find(a => a.id_absen === editId) : null;
            const todayStr = new Date().toISOString().split('T')[0];
            const statusList = ["Hadir (Manual / Dikonfirmasi)", "Izin", "Sakit", "Tidak Hadir (Alpha)"];

            openModal(editing ? "Edit Presensi Siswa" : "Input Presensi Manual / Catat Alpha", `
                <form onsubmit="saveManualAbsensi(event, ${editing ? `'${editId}'` : 'null'})" class="space-y-4">
                    ${editing ? `
                        <div class="bg-blue-50 border border-blue-200 text-blue-700 text-xs p-3 rounded-lg flex items-center gap-2">
                            <i class="fa-solid fa-circle-info"></i>
                            Mengedit presensi <strong>${rec.nama_siswa}</strong> tanggal <strong>${rec.tgl}</strong>. Siswa & tanggal tidak dapat diubah — hapus lalu catat ulang jika salah orang/tanggal.
                        </div>
                    ` : ''}
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Pilih Siswa</label>
                        <select id="formAbsenSiswa" required ${editing ? 'disabled' : 'onchange="checkAbsenDuplicateLive()"'} class="w-full p-3 rounded-xl border border-slate-200 text-sm ${editing ? 'bg-slate-100 text-slate-500' : ''}">
                            ${appState.siswa.map(s => `<option value="${s.nisn}" ${rec && rec.nisn === s.nisn ? 'selected' : ''}>${s.nama_siswa} (${s.nisn})</option>`).join('')}
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Tanggal</label>
                        <input type="date" id="formAbsenTgl" required ${editing ? 'disabled' : 'onchange="checkAbsenDuplicateLive()"'} value="${rec ? rec.tgl : todayStr}" class="w-full p-3 rounded-xl border border-slate-200 text-sm ${editing ? 'bg-slate-100 text-slate-500' : ''}">
                    </div>

                    <!-- PERINGATAN LIVE: langsung tampil begitu Siswa+Tanggal yang dipilih sudah punya catatan -->
                    <div id="absenDuplicateWarning" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs p-3 rounded-lg flex items-start gap-2">
                        <i class="fa-solid fa-triangle-exclamation mt-0.5"></i>
                        <span id="absenDuplicateWarningText"></span>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Status Kehadiran</label>
                        <select id="formAbsenStatus" required class="w-full p-3 rounded-xl border border-slate-200 text-sm">
                            ${statusList.map(st => `<option value="${st}" ${rec ? (rec.status_presensi === st ? 'selected' : '') : (st === 'Tidak Hadir (Alpha)' ? 'selected' : '')}>${st}</option>`).join('')}
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jam Masuk</label>
                            <input type="time" id="formAbsenJamMasuk" value="${rec && rec.jam_masuk !== '-' ? rec.jam_masuk : '08:00'}" class="w-full p-3 rounded-xl border border-slate-200 text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Jam Pulang</label>
                            <input type="time" id="formAbsenJamPulang" value="${rec && rec.jam_pulang !== '-' ? rec.jam_pulang : '16:00'}" class="w-full p-3 rounded-xl border border-slate-200 text-sm">
                        </div>
                    </div>
                    <p class="text-[11px] text-slate-400">Jam masuk/pulang hanya tersimpan bila status mengandung kata "Hadir".</p>
                    <button type="submit" id="btnSubmitManualAbsen" class="w-full py-3 bg-brand-600 text-white font-semibold rounded-xl hover:bg-brand-700 shadow disabled:opacity-50 disabled:cursor-not-allowed">${editing ? 'Simpan Perubahan' : 'Simpan Catatan Presensi'}</button>
                </form>
            `);

            // Langsung cek begitu form dibuka (misalnya default tanggal hari ini kebetulan
            // sudah bertabrakan dengan siswa pertama di daftar dropdown)
            if (!editing) requestAnimationFrame(() => checkAbsenDuplicateLive());
        }

        // Peringatan real-time: jalan setiap kali pilihan Siswa/Tanggal berubah di form input manual.
        // Ini menjawab keluhan "klik simpan tapi tidak terjadi apa-apa" — sekarang user langsung
        // melihat peringatan SEBELUM mencoba submit, bukan cuma toast sekilas setelah submit.
        function checkAbsenDuplicateLive() {
            const siswaEl = document.getElementById("formAbsenSiswa");
            const tglEl = document.getElementById("formAbsenTgl");
            const warningBox = document.getElementById("absenDuplicateWarning");
            const warningText = document.getElementById("absenDuplicateWarningText");
            const submitBtn = document.getElementById("btnSubmitManualAbsen");
            if (!siswaEl || !tglEl || !warningBox) return;

            const nisn = siswaEl.value;
            const tgl = tglEl.value;
            const siswaObj = appState.siswa.find(s => s.nisn === nisn);
            const existing = appState.absensi.find(a => a.nisn === nisn && a.tgl === tgl);

            if (existing) {
                warningText.textContent = `${siswaObj ? siswaObj.nama_siswa : 'Siswa ini'} SUDAH memiliki catatan presensi pada ${tgl} dengan status "${existing.status_presensi}". Gunakan tombol Edit pada baris tabel untuk mengubahnya, bukan menambah baru.`;
                warningBox.classList.remove("hidden");
                if (submitBtn) submitBtn.disabled = true;
            } else {
                warningBox.classList.add("hidden");
                if (submitBtn) submitBtn.disabled = false;
            }
        }

        async function saveManualAbsensi(e, editId = null) {
            e.preventDefault();
            const nisn = document.getElementById("formAbsenSiswa").value;
            const tgl = document.getElementById("formAbsenTgl").value;
            const status = document.getElementById("formAbsenStatus").value;
            const jamMasuk = document.getElementById("formAbsenJamMasuk").value || "08:00";
            const jamPulang = document.getElementById("formAbsenJamPulang").value || "16:00";
            const siswaObj = appState.siswa.find(s => s.nisn === nisn);

            // Cegah duplikat: 1 siswa hanya boleh punya 1 catatan presensi per tanggal
            // (baik dari ceklok GPS mandiri siswa maupun input manual admin/guru)
            const existing = appState.absensi.find(a => a.nisn === nisn && a.tgl === tgl && a.id_absen !== editId);
            if (existing) {
                showNotification(`Siswa "${siswaObj.nama_siswa}" sudah memiliki catatan presensi pada ${tgl} (status: ${existing.status_presensi}). Gunakan tombol Edit pada baris tersebut untuk mengubahnya.`, "warning");
                return;
            }

            if (editId) {
                const rec = appState.absensi.find(a => a.id_absen === editId);
                const updated = {
                    ...rec,
                    status_presensi: status,
                    jam_masuk: status.includes("Hadir") ? jamMasuk : "-",
                    jam_pulang: status.includes("Hadir") ? jamPulang : "-"
                };
                await withSubmitLoading(e, "Menyimpan Perubahan...", async () => {
                    await apiCall("updateAbsensi", updated);
                    invalidateApiCache();
                    Object.assign(rec, updated);
                    closeModal();
                    showNotification("Data presensi berhasil diperbarui!");
                    renderRekapAbsensiMenu();
                });
                return;
            }

            const newAbsen = {
                id_absen: `ABS-${Date.now().toString().slice(-4)}`,
                nisn,
                nama_siswa: siswaObj.nama_siswa,
                tgl,
                jam_masuk: status.includes("Hadir") ? jamMasuk : "-",
                jam_pulang: status.includes("Hadir") ? jamPulang : "-",
                lat: 0,
                lng: 0,
                jarak_meter: 0,
                status_presensi: status
            };

            await withSubmitLoading(e, "Menyimpan...", async () => {
                await apiCall("submitAbsensi", newAbsen);
                invalidateApiCache();
                appState.absensi.unshift(newAbsen);
                closeModal();
                showNotification("Data presensi manual disimpan!");
                renderRekapAbsensiMenu();
            });
        }

        /* ═══════════════════════════════════════════════════════════════════════
           MODULE: FORM & LOG MONITORING GURU
           ═════════════════════════════════════════════════════════════════════ */

        function renderFormMonitoringMenu() {
            const user = appState.currentUser;
            const main = document.getElementById("mainContent");

            main.innerHTML = `
                <div class="max-w-xl mx-auto space-y-6">
                    <div class="border-b border-slate-100 pb-4">
                        <h2 class="text-xl font-bold text-slate-800">Form Monitoring Kunjungan Guru</h2>
                        <p class="text-xs text-slate-500">Laporan evaluasi perkembangan siswa dan kondisi di IDUKA.</p>
                    </div>

                    <form onsubmit="saveMonitoring(event)" class="space-y-4 bg-white border border-slate-200 p-6 rounded-2xl shadow-sm">

        async function saveMonitoring(e) {
            e.preventDefault();
            const user = appState.currentUser;
            const id_tempat = document.getElementById("monIdIduka").value;
            const idukaObj = appState.tempatPKL.find(i => i.id_tempat === id_tempat);

            const newMon = {
                id_monitoring: `MON-0${appState.monitoring.length + 1}`,
                nip_pembimbing: user.username,
                nama_guru: user.nama,
                id_tempat,
                nama_perusahaan: idukaObj.nama_perusahaan,
                tgl_kunjungan: document.getElementById("monTgl").value,
                catatan: document.getElementById("monCatatan").value,
                kendala: document.getElementById("monKendala").value,
                foto_bukti: "https://placehold.co/400x300/16a34a/ffffff?text=Bukti+Kunjungan"
            };

            await withSubmitLoading(e, "Mengirim Laporan...", async () => {
                await apiCall("submitMonitoring", newMon);
                invalidateApiCache();
                appState.monitoring.push(newMon);
                showNotification("Laporan monitoring kunjungan disimpan!");
                switchMenu("log_monitoring");
            });
        }

        // UTILITY CSV EXPORTER
        function exportTableToCSV(tableId) {
            let csv = [];
            let rows = document.querySelectorAll(`#${tableId} tr`);
            for (let i = 0; i < rows.length; i++) {
                let row = [], cols = rows[i].querySelectorAll("td, th");
                for (let j = 0; j < cols.length; j++) row.push('"' + cols[j].innerText.replace(/\n/g, ' ') + '"');
                csv.push(row.join(","));
            }
            let csvFile = new Blob([csv.join("\n")], { type: "text/csv" });
            let downloadLink = document.createElement("a");
            downloadLink.download = `rekap_absensi_${Date.now()}.csv`;
            downloadLink.href = window.URL.createObjectURL(csvFile);
            downloadLink.style.display = "none";
            document.body.appendChild(downloadLink);
            downloadLink.click();
            downloadLink.remove();
        }

        /* ═══════════════════════════════════════════════════════════════════════

        async function initApp() {
            if (IS_PREVIEW) {
                document.getElementById("previewBanner").classList.remove("hidden");
            }

            const session = getSession();
            if (session) {
                appState.currentUser = normalizeUser(session);
                document.getElementById("headerUserNama").textContent = session.nama;
                document.getElementById("headerUserRole").textContent = session.role;
                document.getElementById("userInfoHeader").classList.remove("hidden");

                renderMainNav();
                switchMenu("dashboard"); // tampilkan dashboard dulu (skeleton), lalu isi setelah data siap

                // Muat data terbaru dari Spreadsheet (produksi), lalu render ulang dashboard
                const loaded = await loadAllData();
                if (loaded && currentActiveMenu) switchMenu(currentActiveMenu);
            } else {
                showLoginForm();
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            initApp();
        });
